<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MST Bin - Admin Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ static_base_url }}/css/admin.css">
    <link rel="icon" type="image/png" href="{{ static_base_url }}/img/favicon.ico">
</head>
<body class="admin-login-body">
    <div class="container">
        <div class="row justify-content-center align-items-center min-vh-100">
            <div class="col-12 col-sm-8 col-md-6 col-lg-4">
                <div class="card admin-card shadow-lg">
                    <div class="card-body p-5">
                        <div class="text-center mb-4">
                            <img src="{{ static_base_url }}/img/logo.jpeg" alt="MST Bin Logo" class="mb-3" style="height: 60px; border-radius: 12px;">
                            <h2 class="text-white fw-bold">Admin Panel</h2>
                            <p class="text-purple-light mb-0">Sign in to manage pastes</p>
                        </div>

                        {% if error %}
                        <div class="alert alert-danger alert-dismissible fade show" role="alert">
                            <i class="fas fa-exclamation-circle me-2"></i>{{ error }}
                            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert"></button>
                        </div>
                        {% endif %}

                        <form method="POST" action="{{ url_for('admin_login') }}">
                            <div class="mb-3">
                                <label for="username" class="form-label text-purple-light">
                                    <i class="fas fa-user me-2"></i>Username
                                </label>
                                <input type="text" class="form-control admin-input" id="username" name="username" 
                                       required autofocus autocomplete="username" placeholder="Enter username">
                            </div>
                            <div class="mb-4">
                                <label for="password" class="form-label text-purple-light">
                                    <i class="fas fa-lock me-2"></i>Password
                                </label>
                                <div class="input-group">
                                    <input type="password" class="form-control admin-input" id="password" name="password" 
                                           required autocomplete="current-password" placeholder="Enter password">
                                    <button class="btn admin-input-btn" type="button" id="togglePassword">
                                        <i class="fas fa-eye" id="togglePasswordIcon"></i>
                                    </button>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-purple w-100 py-2 fw-bold">
                                <i class="fas fa-sign-in-alt me-2"></i>Sign In
                            </button>
                        </form>

                        <div class="text-center mt-4">
                            <a href="/" class="text-purple-light text-decoration-none small">
                                <i class="fas fa-arrow-left me-1"></i>Back to MST Bin
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('togglePassword').addEventListener('click', function() {
            const password = document.getElementById('password');
            const icon = document.getElementById('togglePasswordIcon');
            if (password.type === 'password') {
                password.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                password.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        });
    </script>
</body>
</html>
